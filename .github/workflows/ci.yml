name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Require Chrome for browser tests
        run: echo "PRO_QUIZ_TEST_BROWSER=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - run: npm test
